<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="100%" height="100%" role="img" aria-label="PLANEAT restocafe logo">
  <title>PLANEAT restocafe</title>
  <defs>
    <linearGradient id="eat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0901f"/>
      <stop offset="1" stop-color="#d9641e"/>
    </linearGradient>
  </defs>

  <!-- ===== TOP CRATE : cream panel + thin dark frame ===== -->
  <rect x="60" y="72" width="240" height="116" rx="18" fill="#1c1c1c"/>
  <rect x="70" y="80" width="220" height="108" rx="11" fill="#e4dcb8"/>

  <!-- left ribs (4) -->
  <g fill="#1c1c1c">
    <rect x="82"  y="92" width="8" height="66" rx="4"/>
    <rect x="98"  y="92" width="8" height="66" rx="4"/>
    <rect x="114" y="92" width="8" height="66" rx="4"/>
    <rect x="130" y="92" width="8" height="66" rx="4"/>
  </g>

  <!-- right bordered panel + 3 ribs -->
  <rect x="220" y="92" width="64" height="68" rx="8" fill="none" stroke="#1c1c1c" stroke-width="6"/>
  <g fill="#1c1c1c">
    <rect x="234" y="102" width="6" height="48" rx="3"/>
    <rect x="250" y="102" width="6" height="48" rx="3"/>
    <rect x="266" y="102" width="6" height="48" rx="3"/>
  </g>

  <!-- steam (thick wavy ribbons) -->
  <g fill="none" stroke="#2a2a2a" stroke-width="7" stroke-linecap="round">
    <path d="M162,48 C154,40 170,34 162,26 C155,19 168,13 162,6"/>
    <path d="M176,48 C184,40 168,34 176,26 C183,19 170,13 176,6"/>
  </g>

  <!-- coffee bean (pokes above crate) -->
  <ellipse cx="170" cy="108" rx="30" ry="54" fill="#d9641e" stroke="#2a2a2a" stroke-width="4"/>
  <ellipse cx="158" cy="92" rx="7" ry="15" fill="#ec8a3e" opacity="0.55"/>
  <path d="M170,56 C158,84 182,132 170,160" fill="none" stroke="#2a2a2a" stroke-width="4" stroke-linecap="round"/>

  <!-- fork (chunky, dark‑separated tines) -->
  <rect x="183" y="12" width="34" height="45" rx="5" fill="#1c1c1c"/>          <!-- tine silhouette -->
  <g fill="#ef8d1d">
    <rect x="187" y="15" width="4" height="25" rx="2"/>
    <rect x="194" y="15" width="4" height="25" rx="2"/>
    <rect x="201" y="15" width="4" height="25" rx="2"/>
    <rect x="208" y="15" width="4" height="25" rx="2"/>
    <rect x="185" y="42" width="30" height="12" rx="4"/>
  </g>
  <polygon points="185,54 215,54 205,75 195,75" fill="#ef8d1d" stroke="#1c1c1c" stroke-width="2" stroke-linejoin="round"/>
  <rect x="193" y="73" width="14" height="86" rx="7" fill="#ef8d1d" stroke="#1c1c1c" stroke-width="2"/>

  <!-- ===== BANNER (overlaps crate bottom) ===== -->
  <rect x="40" y="165" width="280" height="72" rx="20" fill="#1c1c1c"/>

  <!-- wordmark forced to fill the banner -->
  <text x="180" y="219" text-anchor="middle"
        font-family="'Arial Black','Arial Bold',Gadget,sans-serif"
        font-weight="900" font-size="56" letter-spacing="1"
        textLength="252" lengthAdjust="spacing">
    <tspan fill="#e4dcb8">PLAN</tspan><tspan fill="url(#eat)">EAT</tspan>
  </text>

  <!-- ===== RESTOCAFE TAB ===== -->
  <rect x="108" y="224" width="144" height="46" rx="14" fill="#1c1c1c"/>
  <text x="180" y="255" text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif" font-weight="700"
        font-size="24" letter-spacing="2" fill="#f2f2f2">restocafe</text>
</svg>