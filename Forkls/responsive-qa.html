<!doctype html><html><head><title>FORKLS responsive review</title><style>body{margin:0;background:#e6e8df;font:14px Arial}header{padding:12px 25px;display:flex;gap:25px;align-items:center;border-bottom:1px solid #afb6a1}button{padding:7px 14px;border:1px solid;background:#fffaf3;border-radius:25px;cursor:pointer}main{display:flex;justify-content:center;padding:18px}iframe{display:block;border:1px solid #a9af9c;background:#fffaf3;width:390px;height:844px;flex:none}</style></head><body><header><b>Responsive review</b><button data-size="390,844">Phone 390</button><button data-size="360,740">Small phone 360</button><button data-size="980,1850">Tall 980</button><button data-size="700,390">Landscape 700</button><button data-size="1024,768">Tablet 1024</button><button data-go="scene">Drone parts</button><button data-go="news">News</button><button data-go="home">Home</button></header><main><iframe title="FORKLS responsive preview" src="/index.html"></iframe></main><script>const f=document.querySelector('iframe');document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const[w,h]=b.dataset.size.split(',');f.style.width=w+'px';f.style.height=h+'px'});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.go==='news'){f.contentWindow.location.hash='/news';return}f.contentWindow.location.hash='/';if(b.dataset.go==='scene')setTimeout(()=>f.contentDocument.querySelector('.explode-section').scrollIntoView({behavior:'instant'}),80);else f.contentWindow.scrollTo({top:0,behavior:'instant'})});</script></body></html>
